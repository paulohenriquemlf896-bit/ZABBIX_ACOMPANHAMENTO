<!-- Layout base do painel — CSS inline (sem CDN, ver prompts/tarefas/frontend.txt
     item 2), paleta e tipografia conforme padroes/convencoes.md. -->
<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if auto_refresh_segundos %}
<meta http-equiv="refresh" content="{{ auto_refresh_segundos }}">
{% endif %}
<title>{% block titulo %}Acompanhamento Zabbix{% endblock %}</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Segoe UI,Arial,sans-serif;color:#222;margin:0;background:#f7f8fa}
  header{background:#fff;border-bottom:1px solid #e3e6ea;padding:14px 24px}
  header h1{margin:0;font-size:20px}
  header .sub{color:#666;font-size:13px;margin-top:2px}
  main{padding:24px;max-width:1100px;margin:0 auto}
  nav.periodos{margin-bottom:18px}
  nav.periodos a{display:inline-block;padding:6px 14px;margin-right:6px;border-radius:6px;
    border:1px solid #e3e6ea;color:#222;text-decoration:none;font-size:13px;background:#fff}
  nav.periodos a.ativo{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
  section{background:#fff;border:1px solid #e3e6ea;border-radius:8px;padding:16px 20px;margin-bottom:22px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid #eee;vertical-align:top}
  th{background:#f0f2f5;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  td.rank{font-weight:bold;color:#888;width:28px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.nome{font-weight:600;max-width:420px}
  td.hosts{color:#555;font-size:12px} td.data{white-space:nowrap;color:#555}
  .badge{color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;white-space:nowrap}
  .pill{color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;display:inline-block}
  .sevrow{margin:6px 0 12px;font-size:13px}
  .vazio{color:#888;font-style:italic}
  footer{color:#888;font-size:12px;padding:16px 24px;text-align:center}
  tr:nth-child(even) td{background:#fafbfc}
  .tabela-scroll{overflow-x:auto}
  @media print{body{background:#fff} nav.periodos{display:none}}
</style>
</head>
<body>
<header>
  <h1>Acompanhamento Zabbix — Grupo Rancho</h1>
  <div class="sub">{% block subtitulo %}{% endblock %}</div>
</header>
<main>
  {% block conteudo %}{% endblock %}
</main>
<footer>Grupo Rancho &middot; painel de uso interno, rede local</footer>
</body>
</html>
