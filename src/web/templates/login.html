{% extends "base.html" %}

{% block titulo %}Entrar — Acompanhamento Zabbix{% endblock %}
{% block subtitulo %}{% endblock %}

{% block conteudo %}
<section style="max-width:340px;margin:40px auto">
  <h2>Entrar</h2>
  {% if erro %}<p class="vazio" style="color:#E45959">{{ erro }}</p>{% endif %}
  <form method="post">
    <p>
      <label>Usuário<br>
        <input type="text" name="nome_usuario" required autofocus
               style="width:100%;padding:8px;margin-top:4px;border:1px solid #e3e6ea;border-radius:6px">
      </label>
    </p>
    <p>
      <label>Senha<br>
        <input type="password" name="senha" required
               style="width:100%;padding:8px;margin-top:4px;border:1px solid #e3e6ea;border-radius:6px">
      </label>
    </p>
    <button type="submit"
            style="padding:8px 16px;background:#2b6cb0;color:#fff;border:none;border-radius:6px;cursor:pointer">
      Entrar
    </button>
  </form>
</section>
{% endblock %}
